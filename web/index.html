/* ---- targ: renoma ---- */
.fame{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px 22px;align-items:center;padding:14px 18px;border-radius:16px;border:1px solid rgba(236,188,76,.32);background:radial-gradient(120% 160% at 0% 0%,rgba(236,188,76,.17),rgba(236,188,76,.02) 55%),var(--loam);box-shadow:var(--hi)}
.fbadge{position:relative;width:64px;height:64px;display:grid;place-items:center}
.fbadge svg{position:absolute;inset:0;width:64px;height:64px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.fbadge b{position:relative;font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--grain-ink);margin-top:4px}
.fbody{display:flex;flex-direction:column;gap:5px;min-width:0}
.fbody .gl{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--grain);font-weight:800}
.fname{font-family:var(--f-display);font-size:1.45rem;line-height:1.1}
.fbody .track{display:block;height:9px;border-radius:5px;background:var(--loam3);overflow:hidden}
.fbody .track i{display:block;height:100%;background:linear-gradient(90deg,#dba73a,var(--grain2));transition:width .4s}
.fperks{display:grid;grid-template-columns:repeat(5,auto);gap:4px 18px;margin:0}
.fperks div{display:flex;flex-direction:column}
.fperks dt{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--husk);font-weight:800}
.fperks dd{margin:0;font-family:var(--f-mono);font-size:.86rem;font-weight:700;white-space:nowrap}
.fhint{margin:0;font-size:.84rem}
.sec .hot{padding:10px 14px}.sec .hot .ico,.sec .hot .ico svg{width:40px;height:40px}.sec .hot b{font-size:1.08rem}
.fd.pop{border-left-color:var(--grain2)} .fd.pop .fq{color:var(--grain2)}
@media (max-width:980px){.fame{grid-template-columns:auto minmax(0,1fr)}.fperks{grid-column:1/-1;grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}}

/* ---- targ: sklep ---- */
.stall{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.ware{display:flex;flex-direction:column;gap:9px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--furrow);box-shadow:var(--hi);min-height:150px}
.ware.out{border-style:dashed;opacity:.8}
.wtop{display:flex;gap:12px;align-items:flex-start}
.wtop .slot{width:52px;height:52px}.wtop .slot svg{width:40px;height:40px}
.wn{display:flex;flex-direction:column;min-width:0;flex:1}
.wn b{font-size:.95rem;line-height:1.2}
.wn small{color:var(--husk);font-size:.78rem}
.wx{background:none;border:0;color:var(--husk);font-size:.9rem;padding:2px 4px;border-radius:6px;line-height:1}
.wx:hover{color:var(--rust);background:rgba(227,115,74,.1)}
.pms{border-radius:9px;align-self:stretch;flex-wrap:nowrap}
.pms button{flex:1;padding:5px 6px;font-size:.78rem}
.wbtn{display:flex;gap:6px;margin-top:auto}
.wbtn .btn{flex:1}
.ware.add,.ware.lock{align-items:center;justify-content:center;gap:6px;border:1px dashed var(--furrow2);background:rgba(255,236,200,.025);color:var(--husk);font-weight:700;font-size:.9rem;box-shadow:none;transition:border-color .15s,color .15s,background .15s}
.ware.add .plus{font-family:var(--f-display);font-size:2rem;line-height:1;color:var(--grain)}
.ware.add:hover{border-color:var(--grain);color:var(--chaff);background:rgba(236,188,76,.06)}
.ware.lock{opacity:.55;font-size:.82rem;text-align:center;padding:12px 18px}
.ware.lock .plus svg{width:22px;height:22px}
.ware.lock:hover{opacity:.85}
.sales{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:.84rem;color:var(--husk)}
.sales .gl{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800}
.sale{display:inline-flex;align-items:center;gap:5px}
.sale .ico,.sale .ico svg{width:22px;height:22px}
.sale b{color:var(--chaff);font-family:var(--f-mono);font-size:.8rem}
@media (max-width:560px){.ware.add,.ware.lock{min-height:58px;flex-direction:row;padding:10px}.ware.add .plus{font-size:1.5rem}.fbadge,.fbadge svg{width:52px;height:52px}.fname{font-size:1.2rem}}
/* arkusz: wybór towaru */
.lqrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 6px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.lpick{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:12px;border:1px solid var(--furrow);background:var(--loam2);text-align:left;transition:border-color .15s}
.lpick:hover{border-color:var(--grain)}
.lpick span{display:flex;flex-direction:column;min-width:0}
.lpick b{font-size:.88rem;line-height:1.2}
.lpick small{color:var(--husk);font-size:.76rem}

/* ---- targ: zamówienia ---- */
.order .ox{background:none;border:0;padding:0 2px;margin-left:6px;color:#8a7258;font-weight:800;font-size:.8rem;line-height:1}
.order .ox:hover{color:#a2401c}
.order .ox.arm{color:#fff;background:#a2401c;border-radius:6px;padding:2px 7px}
.order .oh{align-items:center}
.order .oh .ono{margin-left:auto}
.order .what.extra{opacity:.88;border:1px dashed rgba(122,74,16,.45);border-radius:8px;padding:4px 6px;margin:0 -6px;background:rgba(236,188,76,.12)}
.order .what .nov{display:block;font-style:normal;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:#8a5a14;font-weight:800}
.order .ft2{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.order .ft2 small{font-size:.72rem;font-weight:700;color:#a2401c}
.order.part{box-shadow:0 0 0 2px #c99a30,0 14px 26px -14px rgba(0,0,0,.9)}
.order.wait{align-items:center;justify-content:center;gap:4px;min-height:150px;opacity:.55;transform:none}
.order.wait b{font-family:var(--f-mono);font-size:1rem}

/* ---- towar na wystawie: niebieski licznik w spiżarni ---- */
.pslot .shopq{position:absolute;left:3px;top:3px;min-width:18px;padding:0 4px;border-radius:7px;background:#2f6fa8;color:#eef6ff;font-family:var(--f-mono);font-size:.68rem;line-height:16px;font-weight:700;text-align:center;border:1px solid rgba(0,0,0,.45);z-index:1}
.shopt{color:#8cc2ee}
.ctxi:disabled{opacity:.45;cursor:default}
.ctxi:disabled:hover{background:none}
/* ---- bez tytułu w nagłówku: zostaje sam kalendarz ---- */
.brand{padding:8px 14px}.brand small{margin-top:0;font-size:.88rem;color:var(--chaff)}
.skyband{min-height:140px}
.skyband.hasbg{min-height:clamp(170px,17vw,250px)}
.skyband.hasbg::after{background:linear-gradient(180deg,rgba(19,15,11,.15) 0%,rgba(19,15,11,0) 35%,rgba(19,15,11,.55) 100%)}
/* ---- linie produkcyjne: kolejność, ukrywanie, młynarz ---- */
.lstep{width:132px}
.lbtn .btn.sm{padding:4px 7px}
.lhead{flex-wrap:wrap;row-gap:6px}
.lgrip{cursor:grab;color:var(--husk);font-size:1.1rem;line-height:1;padding:2px 3px;border-radius:6px;user-select:none}
.lgrip:hover{color:var(--grain);background:rgba(255,236,200,.06)}
.lgrip:active{cursor:grabbing}
.lord{display:inline-flex;gap:2px;margin-left:4px}
.lx{background:none;border:1px solid transparent;border-radius:6px;color:var(--husk);font-weight:800;font-size:.82rem;line-height:1;padding:3px 6px}
.lx:hover:not(:disabled){color:var(--chaff);border-color:var(--furrow2)}
.lx:disabled{opacity:.25}
.lhide:hover:not(:disabled){color:var(--rust)}
.lmw{margin-left:auto;display:flex;align-items:center}
.lml{display:inline-flex;align-items:center;gap:8px;padding:3px 4px 3px 8px;border-radius:10px;border:1px solid rgba(147,203,95,.45);background:rgba(147,203,95,.08)}
.lml.off{opacity:.6}
.lml svg{width:26px;height:26px}
.lml>span{display:flex;flex-direction:column;font-weight:700;font-size:.82rem;line-height:1.15}
.lml small{font-weight:500;color:var(--husk);font-size:.72rem}
.lq{color:var(--sprout)!important}
.lq .lx{padding:0 3px;font-size:.72rem}
.lrow.dragsrc{opacity:.5}
.lrow.dropb{box-shadow:0 -3px 0 var(--grain),var(--hi)}
.lrow.dropa{box-shadow:0 3px 0 var(--grain),var(--hi)}
.lhidden{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:14px}
.lhidden .lbl{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--husk);font-weight:800;margin-right:4px}
.lhidden .chip{display:inline-flex;align-items:center;gap:5px;opacity:.75}
.lhidden .chip .ico,.lhidden .chip .ico svg{width:18px;height:18px}
.lpick.dim{opacity:.5}
.lpick.used{opacity:.38;filter:grayscale(1);cursor:not-allowed}.lpick.used:hover{border-color:var(--furrow)}
/* ---- linie: wersja zwarta ---- */
.lines{gap:7px}
.lrow{padding:6px 10px 4px;border-radius:12px}
.lrow.fold{padding:5px 10px}
.lrow .lhead{margin-bottom:0;gap:6px}
.lhead .ico,.lhead .ico svg{width:22px;height:22px}
.lhead b{font-size:.95rem}
.lfold{font-size:.85rem;padding:2px 5px;min-width:22px}
.lsum{font-size:.78rem;color:var(--husk);display:inline-flex;align-items:center;gap:5px}
.lsum .dot{width:7px;height:7px;border-radius:50%;background:var(--sprout);box-shadow:0 0 6px var(--sprout)}
.lpath{gap:4px;padding:4px 2px 4px}
.lnode{width:66px;gap:3px}
.lnode .slot{width:38px;height:38px;border-radius:8px}.lnode .slot svg{width:30px;height:30px}
.lnode .slot .cnt{font-size:.66rem;line-height:15px;min-width:17px;right:-5px;bottom:-5px}
.lnode small{font-size:.64rem}
.larr svg{width:14px;height:14px}
.lstep{width:112px;padding:4px 5px;gap:2px;border-radius:10px}
.lstep .lm .mart{width:30px;height:30px}.lstep .lm .mart svg{width:24px;height:24px}
.lstep .ringwrap.sm{width:34px;height:34px}
.lstep small{font-size:.64rem}
.lbtn .btn.sm{padding:2px 6px;font-size:.72rem;border-radius:6px}
.lml{padding:2px 3px 2px 6px;gap:6px}.lml svg{width:20px;height:20px}.lml>span{font-size:.76rem}.lml small{font-size:.66rem}
.lml .btn.sm,.lmw>.btn.sm{padding:3px 8px;font-size:.74rem}
.lbtn .btn{white-space:nowrap}
/* ---- gain feed ---- */
#feed{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:65;display:flex;flex-direction:column-reverse;gap:7px;width:min(290px,calc(100vw - 32px));pointer-events:none}
.fd{display:flex;align-items:center;gap:10px;padding:7px 13px 7px 7px;border-radius:14px;background:rgba(29,23,17,.93);border:1px solid var(--furrow2);border-left:3px solid var(--sprout);box-shadow:0 14px 28px -14px rgba(0,0,0,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fdin .4s cubic-bezier(.2,.9,.3,1.25)}
.fd .fi{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:10px;background:rgba(255,236,200,.05)}
.fd .fi svg{width:34px;height:34px;overflow:visible}
.fd .fx{min-width:0;line-height:1.2}
.fd .fl1{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fd .fq{display:inline-block;font-family:var(--f-mono);color:var(--sprout);font-size:1.02rem}
.fd .fn{font-weight:700;font-size:.9rem}
.fd small{display:block;color:var(--husk);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fd.flour{border-left-color:var(--grain2)}
.fd.coin{border-left-color:var(--grain)} .fd.coin .fq{color:var(--grain2)}
.fd.gold{border-color:rgba(236,188,76,.55);border-left-color:var(--grain2);background:linear-gradient(90deg,rgba(68,50,20,.95),rgba(29,23,17,.93))} .fd.gold .fq{color:var(--grain2)}
.fd.spend{border-left-color:var(--rust);opacity:.92} .fd.spend .fq{color:var(--rust)}
.fd.bump .fq{animation:bump .35s ease-out}
.fd.out{animation:fdout .45s ease-in forwards}
@keyframes fdin{from{opacity:0;transform:translateX(60px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fdout{to{opacity:0;transform:translateX(60px)}}
@keyframes bump{40%{transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){.fd,.fd.out,.fd.bump .fq{animation:none}.fd.out{opacity:0}}

/* ---- toasts ---- */
.toasts{position:fixed;left:calc(50% - 140px);transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,520px)}
.toast{background:var(--chaff);color:var(--soil);border-radius:10px;padding:9px 15px;font-weight:700;font-size:.9rem;box-shadow:0 10px 28px rgba(0,0,0,.5);text-align:center}
.toast.gold{background:linear-gradient(180deg,#f3c95e,#dba73a);color:var(--grain-ink)}

@media (max-width:860px){
  .floor{grid-template-columns:1fr}
  .mlist{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:6px;scroll-snap-type:x proximity}
  .mtile{width:auto;min-width:215px;flex:none;scroll-snap-align:start}
}
@media (max-width:560px){
  .brand b{font-size:1.45rem}
  .skyband{min-height:0}
  .chipstat.lvl{min-width:110px}
  .book{grid-template-columns:1fr}
  .plots{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .inv{grid-template-columns:1fr}
  .segs .seg span{display:none}
  .fcs{grid-template-columns:repeat(2,minmax(0,1fr))}
  nav.tabs button span:not(.badge){display:none}
  nav.tabs button.on span:not(.badge){display:inline}
  .toasts{left:50%}
  #feed{bottom:auto;top:calc(54px + env(safe-area-inset-top,0px));flex-direction:column;right:8px;width:205px;gap:4px}
  .fd{padding:4px 9px 4px 4px;gap:7px;border-radius:11px}
  .fd .fi{width:28px;height:28px}.fd .fi svg{width:26px;height:26px}
  .fd .fq{font-size:.88rem}.fd .fn{font-size:.8rem}.fd small{font-size:.68rem}
  .fd:nth-child(n+4){display:none}
  .mdet{padding:14px}
  .stations{grid-template-columns:1fr}
  .rcard .rside{align-items:stretch;width:100%}
  .rb{justify-content:flex-start}
}

/* ===================== MOTYW: szkło na krajobrazie =====================
   Tło (obrazy z bg/) wypełnia cały ekran, interfejs to półprzezroczyste panele
   ze złotą obwódką. Ta warstwa nadpisuje wcześniejsze style. */
:root{
  --soil:rgba(16,12,9,.72); --loam:rgba(29,23,17,.78); --loam2:rgba(44,34,25,.72); --loam3:rgba(58,46,33,.7);
  --furrow:rgba(236,188,76,.15); --furrow2:rgba(236,188,76,.26); --gl-bd:rgba(236,188,76,.26);
  --card:linear-gradient(180deg,rgba(38,29,20,.82),rgba(22,17,12,.86));
  --shadow:0 16px 36px -18px rgba(0,0,0,.95);
}
html{background:#130f0b}
body{background:none!important}
#sky{position:fixed;inset:0;width:100vw;height:100vh;z-index:-2;display:block}
.bgshade{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(120% 95% at 50% 45%,rgba(14,10,7,.18),rgba(14,10,7,.6)),linear-gradient(180deg,rgba(14,10,7,.5),rgba(14,10,7,.12) 28%,rgba(14,10,7,.3))}

/* górny pasek: zakładki + kalendarz, poziom, księga, kronika, kasa */
.bar-top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,rgba(24,18,13,.9),rgba(24,18,13,.78));backdrop-filter:blur(10px) saturate(1.1);-webkit-backdrop-filter:blur(10px) saturate(1.1);border-bottom:1px solid var(--gl-bd);box-shadow:0 12px 30px -18px rgba(0,0,0,.95)}
.barin{max-width:1240px;gap:12px 16px;flex-wrap:wrap}
nav.tabs{gap:4px}
nav.tabs button{padding:16px 14px 13px;font-size:1rem;gap:9px}
nav.tabs button.on{text-shadow:0 0 14px rgba(236,188,76,.35)}
nav.tabs .tico{width:20px;height:20px}
.status{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
.clockchip{display:flex;flex-direction:column;line-height:1.2;font-size:.74rem;color:var(--husk);text-align:right;padding-right:4px;white-space:nowrap}
.clockchip b{color:var(--chaff);font-weight:700;font-size:.82rem}
.status .chipstat{background:rgba(255,236,200,.04);border:1px solid var(--gl-bd);border-radius:10px;padding:5px 10px}
.status .chipstat.lvl{min-width:116px}
.status .chipstat span{font-size:.58rem}
.status .chipstat strong{font-size:.78rem;white-space:nowrap}
.status .xp{height:4px;margin-top:3px}
.status .chipstat.icob{grid-template-rows:auto;padding:6px 10px 6px 8px;column-gap:7px}
.status .chipstat.icob .icl{display:none}
.status .chipstat.icob .tico{grid-row:auto;width:19px;height:19px}
.cash{background:linear-gradient(180deg,rgba(66,48,22,.9),rgba(38,28,14,.9));border-color:rgba(236,188,76,.55);padding:6px 14px 6px 8px}

/* nagłówki działów */
main{padding-top:26px}
.sechead h2{display:flex;align-items:center;gap:12px;font-size:2.15rem;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.h2ico{width:30px;height:30px;color:var(--grain);flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.sechead p{color:#ddd0b8;text-shadow:0 1px 8px rgba(0,0,0,.85)}
.more{text-shadow:0 1px 6px rgba(0,0,0,.7)}
h3{text-shadow:0 1px 8px rgba(0,0,0,.5)}

/* panele szklane */
.cal,.kpi,.item,.ware,.lrow,.fame,.tray,.pbar-sel,.plan,.plot,.ach,.fc,.lpick,.empty-note,.hot,.panel,#ctx{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.kpi,.item,.ware,.lrow,.plan,.ach,.fc{border-color:var(--gl-bd)}
.empty-note{background:rgba(16,12,9,.6);border-color:var(--gl-bd)}
.panel{background:linear-gradient(180deg,rgba(34,26,18,.95),rgba(22,17,12,.96))!important;border:1px solid var(--gl-bd)}
#ctx{background:rgba(26,20,14,.94)}

/* przyciski */
.btn{background:linear-gradient(180deg,rgba(58,45,31,.88),rgba(34,26,18,.9));border-color:var(--gl-bd);border-radius:10px}
.btn:hover:not(:disabled){border-color:rgba(236,188,76,.55)}
.btn .bico{width:18px;height:18px;vertical-align:-4px;margin-right:7px}
.btn.harv{background:linear-gradient(180deg,rgba(104,140,56,.55),rgba(54,80,28,.6));border-color:rgba(147,203,95,.65);color:#eef7e0;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 rgba(0,0,0,.35)}
.btn.harv .bico{color:#b8e08a}
.btn.harv:disabled{opacity:.5}
.toolbar{gap:10px}
.toolbar .sp{display:inline-flex;align-items:center;gap:7px;color:#ddd0b8;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.toolbar .sp .bico{width:17px;height:17px;color:var(--grain)}

/* kalendarz: kafelki pór roku i prognoza */
.cal{padding:16px 18px;border-radius:18px;gap:12px;border:1px solid var(--gl-bd);background:linear-gradient(180deg,rgba(30,23,16,.84),rgba(20,15,11,.88))}
.year{padding-top:8px}
.segs{gap:8px}
.seg{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:12px;border:1px solid;border-top-width:1px;font-size:.8rem}
.seg .wxi{width:30px;height:30px;flex:none}
.seg .st{min-width:0}
.seg b{font-family:var(--f-display);font-size:1.08rem}
.seg.s0{border-color:rgba(140,196,90,.5);background:linear-gradient(90deg,rgba(140,196,90,.2),rgba(140,196,90,.04))}
.seg.s1{border-color:rgba(234,185,74,.5);background:linear-gradient(90deg,rgba(234,185,74,.2),rgba(234,185,74,.04))}
.seg.s2{border-color:rgba(217,129,58,.5);background:linear-gradient(90deg,rgba(217,129,58,.2),rgba(217,129,58,.04))}
.seg.s3{border-color:rgba(168,212,236,.45);background:linear-gradient(90deg,rgba(168,212,236,.16),rgba(168,212,236,.03))}
.seg.now{box-shadow:0 0 0 1px rgba(255,236,200,.4),0 0 22px -6px rgba(236,188,76,.55)}
.mark{background:var(--grain2);width:3px;height:calc(100% + 6px);box-shadow:0 0 10px rgba(246,210,122,.8)}
.mark::before{border-top-color:var(--grain2)}
.calinfo{gap:6px 24px;font-size:.9rem}
.calinfo span{display:inline-flex;align-items:center;gap:8px}
.calinfo .wxi{width:18px;height:18px}
.fcs{gap:10px}
.fcd{padding:10px 14px;border-radius:12px;background:rgba(10,8,6,.45);border:1px solid var(--gl-bd);gap:12px;font-size:.86rem}
.fcd .wxi{width:30px;height:30px}
.fcd.now{border-color:rgba(236,188,76,.6);background:linear-gradient(90deg,rgba(236,188,76,.14),rgba(10,8,6,.4));box-shadow:none}

/* karty poletek: zaorana ziemia w perspektywie */
.plots{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.plot,.plot.env-mokre,.plot.env-szklarnia,.plot.winter{height:224px;border-radius:14px;border:1px solid var(--gl-bd);background:linear-gradient(180deg,rgba(30,23,16,.92),rgba(18,14,10,.94))}
.plot.env-mokre{border-color:rgba(90,163,204,.5)} .plot.env-szklarnia{border-color:rgba(143,208,196,.55)} .plot.winter{border-color:rgba(168,212,236,.45)}
.plot:hover{border-color:rgba(236,188,76,.6)}
.plot .ptop{padding:9px 12px 8px;background:rgba(10,8,6,.4);border-bottom:1px solid rgba(236,188,76,.14)}
.plot .tag{font-size:.66rem;color:#d9ccb4}
.soil i{width:5px;height:11px}
.plot .art{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(180deg,rgba(40,30,20,.9),rgba(70,50,30,.6))}
.plot .art::before{content:"";position:absolute;left:-60%;right:-60%;top:-160%;bottom:0;z-index:-2;
  background:repeating-linear-gradient(90deg,#634529 0 11px,#3c2a17 11px 22px);transform:perspective(320px) rotateX(58deg);transform-origin:50% 100%}
.plot .art::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(18,14,10,.55),rgba(18,14,10,0) 40%,rgba(18,14,10,.2))}
.plot.env-mokre .art::before{background:repeating-linear-gradient(90deg,#2f5263 0 10px,#1c3443 10px 20px)}
.plot.env-szklarnia .art::after{background:linear-gradient(90deg,rgba(143,208,196,.18) 1px,transparent 1px) 0 0/25% 100%,linear-gradient(180deg,rgba(18,14,10,.65),rgba(143,208,196,.1) 45%,rgba(18,14,10,.25))}
.plot.winter .art::before{background:repeating-linear-gradient(90deg,#c9d5de 0 10px,#9aabb8 10px 20px)}
.plot.empty .art{align-items:center}
.plot .plus{margin:0;width:54px;height:54px;border:1.5px solid rgba(255,236,200,.6);background:rgba(10,8,6,.35);color:var(--chaff);font-size:1.9rem;font-weight:300;backdrop-filter:blur(2px)}
.plot .art .flake{margin:0}
.plot .pfoot{padding:8px 12px 11px;background:rgba(14,11,8,.86);border-top:1px solid rgba(236,188,76,.14)}
.plot .pn{display:flex;align-items:center;gap:6px}
.plot .pn .bico{width:15px;height:15px;color:var(--grain);flex:none}
.plot.buy{background:rgba(16,12,9,.55);border:1.5px dashed rgba(236,188,76,.4)}
.plot.buy .plus{margin-bottom:6px}
.plot .price{display:inline-flex;align-items:center;gap:6px;color:var(--chaff)}
.plot .price svg{width:18px;height:18px}

/* cel i pasek zdobyczy */
#goal .goal:not(.min){display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;align-items:center}
#goal .gico{grid-row:1/4;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(147,203,95,.14);border:1px solid rgba(147,203,95,.45);color:var(--sprout)}
#goal .gico .bico{width:20px;height:20px}
#goal .goal.min .gico{display:none}
#goal .goal{border-color:var(--gl-bd);backdrop-filter:blur(8px)}
.fd{backdrop-filter:blur(8px);border-color:var(--gl-bd)}

@media (max-width:1100px){.clockchip{display:none}}
@media (max-width:860px){.status{margin-left:0;width:100%;justify-content:flex-end;padding-bottom:8px}.barin{gap:0 10px}}
@media (max-width:560px){.segs .seg .st{display:block}.segs .seg .st>span{display:none}.seg{padding:7px 4px;gap:3px;flex-direction:column;text-align:center}.seg b{font-size:.82rem!important}.seg .wxi{width:22px;height:22px}.seg b{font-size:.9rem}.fcd{padding:8px 9px;gap:7px}.fcd .wxi{width:22px;height:22px}.sechead h2{font-size:1.7rem}.h2ico{width:24px;height:24px}.status .chipstat.lvl{min-width:96px}}


/* ---- grafiki zagonów (web/plots) ---- */
.plot .art{background:#2a1d12}
.plot .art::before{content:none}
.plot .art::after{background:linear-gradient(180deg,rgba(14,10,7,.35),rgba(14,10,7,0) 30%,rgba(14,10,7,0) 75%,rgba(14,10,7,.3))}
.plot .art .pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .4s ease}
.plot:hover .art .pimg{transform:scale(1.04)}
.plot.winter:not(.empty) .art .pimg{filter:saturate(.45) brightness(.85) hue-rotate(-8deg)}
.plot.winter:not(.empty) .art::after{background:linear-gradient(180deg,rgba(220,236,246,.28),rgba(220,236,246,.08))}
.plot .art .flake{position:relative;z-index:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.seed .sv,.cur .sv{position:relative;overflow:hidden;border-radius:9px;border:1px solid var(--gl-bd);background:#2a1d12}
.seed .sv{width:52px;height:52px}.cur .sv{width:96px;height:96px}
.sv .pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.seed.lock .sv .pimg,.seed.off .sv .pimg{filter:grayscale(.7) brightness(.7)}
/* ---- stanowiska maszyn w liniach ---- */
.lsta{display:flex;gap:3px;justify-content:center;margin-top:1px}
.lsta i{display:block;width:22px;height:6px;border-radius:3px;background:rgba(255,236,200,.1);border:1px solid rgba(255,236,200,.18);overflow:hidden}
.lsta i.other{background:rgba(255,236,200,.28)}
.lsta i.on{border-color:rgba(147,203,95,.7);background:rgba(147,203,95,.18)}
.lsta i.on b{display:block;height:100%;background:var(--sprout)}
.lstep .ringwrap{position:relative}
.lmx{position:absolute;right:-8px;top:-6px;font-style:normal;font-family:var(--f-mono);font-size:.62rem;font-weight:700;padding:0 4px;border-radius:6px;background:var(--sprout);color:#1a2410;line-height:14px}

/* ===== GRAFIKI MALOWANE: maszyny, ludzie, pory roku, zima ===== */
.mart img{width:118%;height:118%;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));pointer-events:none}
.mart.pers{border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 40%,#3a2d20,#15100b)}
.mart.pers img{width:100%;height:100%;filter:none}
.ringwrap .mart img{width:112%;height:112%}
.item .ih .mart{width:56px;height:56px}
.item .ih .mart.pers{width:76px;height:76px;box-shadow:0 0 0 2px rgba(236,188,76,.35)}
.seg{position:relative;overflow:hidden}
.seg>*{position:relative}
.seg::before{content:"";position:absolute;inset:0;background-size:cover;background-position:center;opacity:.55;transition:opacity .3s}
.seg.now::before{opacity:.9}
.seg.s0::before{background-image:linear-gradient(90deg,rgba(10,8,5,.7),rgba(10,8,5,.1)),url(ui/pora-wiosna-tlo.webp)}
.seg.s1::before{background-image:linear-gradient(90deg,rgba(10,8,5,.7),rgba(10,8,5,.1)),url(ui/pora-lato-tlo.webp)}
.seg.s2::before{background-image:linear-gradient(90deg,rgba(10,8,5,.7),rgba(10,8,5,.1)),url(ui/pora-jesien-tlo.webp)}
.seg.s3::before{background-image:linear-gradient(90deg,rgba(10,8,5,.7),rgba(10,8,5,.1)),url(ui/pora-zima-tlo.webp)}
.seg b,.seg span{text-shadow:0 1px 3px rgba(0,0,0,.8)}
.plot.winter:not(.empty) .art .pimg{filter:none}
.plot.winter:not(.empty) .art::after{background:none}
.plot .art .pimg{object-position:center 45%}
.seed .sv .pimg.sasz{object-fit:contain;padding:4px}

/* ===== PRZETWÓRNIA: tło wnętrza młyna; SPIŻARNIA: kosz i pauza ===== */
.bgroom{position:fixed;inset:0;z-index:-1;pointer-events:none;background:#1a120b url(bg/przetwornia.webp) center 40%/cover no-repeat;opacity:0;transition:opacity .5s ease}
body[data-tab="prz"] .bgroom{opacity:1}
body[data-tab="prz"] .bgshade{background:linear-gradient(180deg,rgba(14,10,6,.35),rgba(14,10,6,.55) 45%,rgba(14,10,6,.8))}
.pslot.bin{border-style:dashed;border-color:rgba(214,110,90,.55);background:rgba(120,40,30,.12);color:#e09a88;display:grid;place-items:center}
.pslot.bin svg.trash{width:30px;height:30px;filter:none}
.pslot.bin.over,.pslot.bin.target{background:rgba(180,60,40,.3);border-color:#e0806a}
.btn svg.trash{width:15px;height:15px;vertical-align:-3px}
.ctxi .ci svg.trash{width:18px;height:18px}
.pausebar{position:sticky;top:64px;z-index:30;display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1220px;margin:14px auto 0;padding:11px 16px;border-radius:12px;border:1px solid rgba(224,128,106,.6);background:linear-gradient(90deg,rgba(110,34,22,.92),rgba(60,22,14,.92));box-shadow:0 8px 24px -10px rgba(0,0,0,.7)}
.pausebar[hidden]{display:none}
.pausebar b{font-family:var(--f-display);font-size:1.05rem;color:#ffd9c8}
.pausebar span{flex:1;min-width:200px;color:#f3d6c8}
.tray p .bad{color:#ff9d84}
.vols{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px 36px;margin:6px 0 16px;max-width:820px}
.volr{display:grid;grid-template-columns:150px 1fr 46px;align-items:center;gap:12px;font-size:.92rem;color:var(--husk)}
.volr.main{grid-column:1/-1;max-width:392px;color:var(--chaff);font-weight:700}
.volr input{width:100%;accent-color:#ecbc4c}.volr b{text-align:right;color:var(--chaff);font-size:.85rem}
/* ===== TRYB SIEWU ===== */
.sowbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:4px 0 14px;padding:10px 14px;border-radius:14px;border:1px solid rgba(236,188,76,.55);background:linear-gradient(90deg,rgba(70,52,22,.92),rgba(36,27,14,.9));box-shadow:0 0 24px -8px rgba(236,188,76,.45)}
.sowbar .sv{width:52px;height:52px;flex:none;position:relative;overflow:hidden}.sowbar .sv .pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.sowbar .si{flex:1;min-width:200px;display:flex;flex-direction:column}.sowbar .si b{font-family:var(--f-display);font-size:1.1rem;color:#ffe3a0}.sowbar small{color:var(--husk)}
.sowbar .sbtns{display:flex;gap:8px;flex-wrap:wrap}
.plots.sowing .plot:not(.sowok):not(.sown){opacity:.6;filter:saturate(.7)}
.plots.sowing .plot.sowok{cursor:copy;box-shadow:0 0 0 2px rgba(236,188,76,.6),0 0 18px -4px rgba(236,188,76,.6)}
.plots.sowing .plot.sowok:hover{transform:translateY(-2px);box-shadow:0 0 0 2px #ecbc4c,0 0 26px -2px rgba(236,188,76,.8)}
.plots.sowing .plot.sowok .plus{animation:sowpulse 1.4s ease-in-out infinite}
@keyframes sowpulse{50%{transform:scale(1.12);opacity:.75}}
.plot.sown{animation:sown .5s ease-out}
@keyframes sown{0%{transform:scale(.96);box-shadow:0 0 0 3px #ecbc4c,0 0 30px rgba(236,188,76,.9)}100%{transform:none}}
.plots.sowing{user-select:none}
.seed.on{box-shadow:0 0 0 2px #ecbc4c}
/* ===== TŁA SPIŻARNI I TARGU ===== */
body[data-tab="spiz"] .bgroom{opacity:1;background-image:url(bg/spizarnia.webp)}
.bgmk{position:fixed;inset:0;z-index:-1;pointer-events:none;background:#1a120b center 45%/cover no-repeat;opacity:0;transition:opacity .5s ease}
body[data-tab="targ"] .bgmk.day{opacity:1}
body[data-tab="targ"] .bgmk.night{opacity:var(--night,0)}
body[data-tab="spiz"] .bgshade{background:linear-gradient(180deg,rgba(14,10,6,.35),rgba(14,10,6,.55) 45%,rgba(14,10,6,.8))}
body[data-tab="targ"] .bgshade{background:linear-gradient(180deg,rgba(14,10,6,.3),rgba(14,10,6,.5) 45%,rgba(14,10,6,.78))}
/* ===== NASIONA: plon i mąka z zapasów ===== */
.seed .srow{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.yld{display:inline-flex;align-items:center;gap:3px;padding:1px 8px 1px 3px;border-radius:999px;background:rgba(236,188,76,.14);border:1px solid rgba(236,188,76,.4)}
.yld svg{width:22px;height:22px}.yld b{font-size:1rem;color:#ffe3a0}.yld b::before{content:"×";font-size:.8em;opacity:.7;margin-right:1px}
.fpots{display:inline-flex;gap:5px;align-items:center}.fpots small{color:var(--husk)}
.fp{display:inline-flex;align-items:center;gap:1px;font-style:normal}.fp svg{width:20px;height:20px}.fp b{font-size:.82rem;color:var(--chaff)}.fp.zero{opacity:.5}
.pot{display:inline-flex;align-items:center;gap:3px;margin-left:auto;padding:2px 8px 2px 6px;border-radius:999px;background:rgba(111,166,74,.16);border:1px solid rgba(140,196,90,.45);color:#bfe39a;flex:none}
.pot .bico{width:14px;height:14px}.pot b{font-size:.85rem}.pot.zero{opacity:.45;filter:grayscale(1)}
.lhead .pot{margin-left:10px}
.lpick span.pot{flex-direction:row;align-self:center}
.lpick{position:relative}.lpick small .star{width:12px;height:12px;vertical-align:-2px;margin-right:3px}
.lpick.new small{font-style:italic}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="bgroom" aria-hidden="true"></div>
<div class="bgmk day" aria-hidden="true"></div><div class="bgmk night" aria-hidden="true"></div>
<div class="bgshade" aria-hidden="true"></div>
<header class="bar-top">
  <div class="barin">
    <nav class="tabs" id="tabs" aria-label="Działy gospodarstwa"></nav>
    <div class="status">
      <span class="clockchip" id="clock"></span>
      <div class="chipstat lvl"><span id="lvlLbl">Poziom 1</span><strong class="num" id="xpTxt">0 / 70 PD</strong><span class="xp"><i id="xpbar"></i></span></div>
      <button class="chipstat icob" data-act="tab" data-v="ksiega" title="Księga mąk" aria-label="Księga mąk"><svg class="tico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1z"/><path d="M12 6v14"/></svg><span class="icl">Księga</span><strong class="num" id="coll">0/70</strong></button>
      <button class="chipstat icob" data-act="tab" data-v="kron" title="Kronika: osiągnięcia, zapis gry, ustawienia" aria-label="Kronika"><svg class="tico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="14" r="6"/><path d="M9 3h6l-1 5h-4zM12 11v3l2 1"/></svg><span class="icl">Kronika</span><strong class="num" id="achc">0</strong></button>
      <div class="cash" title="Kasa"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="17" r="12" fill="#8a6418"/><circle cx="16" cy="15.5" r="12" fill="#ecbc4c" stroke="#8a6418" stroke-width="1.5"/><circle cx="16" cy="15.5" r="8.5" fill="none" stroke="#c99a30" stroke-width="1.2"/></svg><b id="coins">0 zł</b></div>
    </div>
  </div>
</header>
<main><div id="pausebar" class="pausebar" role="alert" hidden></div>
<div id="view"></div></main>
<aside id="goal" aria-label="Bieżący cel"></aside>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div id="ctx" role="menu" hidden></div>
<div id="feed" aria-live="polite"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="data.js"></script>
<script src="sound.js"></script>
<script src="game.js"></script>
<script src="desktop.js"></script>
</body>
</html>
