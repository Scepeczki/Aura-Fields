# Gra z katalogu web/ na gałęzi main trafia na GitHub Pages, więc w grę można grać z przeglądarki i telefonu.
# Jednorazowo w ustawieniach repozytorium: Settings → Pages → Source: GitHub Actions.
name: Strona gry
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
