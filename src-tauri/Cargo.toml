[package]
name = "aura-fields"
version = "1.2.0"
description = "Aura Fields: gra o gospodarstwie i młynie"
edition = "2021"
publish = false

[lib]
name = "aura_fields_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
